<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center">
            <h2 class="me-3">Control de Estación</h2>
            <div class="d-flex align-items-center">
                <label for="estacionSelector" class="form-label me-2 mb-0">
                    <i class="fas fa-map-marker-alt text-primary"></i> Estación:
                </label>
                <select class="form-select" id="estacionSelector" style="width: 250px;">
                    <option value="">Seleccionar estación</option>
                </select>
            </div>
            <div class="d-flex align-items-center ms-3">
                <label for="margenHoras" class="form-label me-2 mb-0">Margen:</label>
                <input type="number" class="form-control" id="margenHoras" min="0" max="24" step="1" value="2" style="width: 80px;">
                <span class="ms-2">horas</span>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-6 mb-4">
            <div class="card h-100">
                <div class="card-header">Llegadas</div>
                <div class="card-body">
                    <table id="tablaLlegadas" class="table table-striped table-bordered">
                        <thead>
                            <tr>
                                <th>Número</th>
                                <th>Origen</th>
                                <th>Destino</th>
                                <th>Hora</th>
                                <th>Estado</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-6 mb-4">
            <div class="card h-100">
                <div class="card-header">Salidas</div>
                <div class="card-body">
                    <table id="tablaSalidas" class="table table-striped table-bordered">
                        <thead>
                            <tr>
                                <th>Número</th>
                                <th>Origen</th>
                                <th>Destino</th>
                                <th>Hora</th>
                                <th>Estado</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    $(function () {
        let cargando = false;

        if (window.intervaloControlEstacion) {
            clearInterval(window.intervaloControlEstacion);
        }

        cargarEstaciones().then(function () {
            cargarMovimientos();
        });
        window.intervaloControlEstacion = setInterval(cargarMovimientos, 10000);

        function margenHoras() {
            const valor = Number($('#margenHoras').val());
            if (!Number.isFinite(valor) || valor < 0) {
                return 2;
            }
            return Math.min(valor, 24);
        }

        function formatearHora(hora) {
            if (!hora) {
                return '-';
            }
            return String(hora).slice(0, 5);
        }

        function cargarEstaciones() {
            return fetch('/api/estaciones', {
                headers: getHeaders()
            })
                .then(function (response) {
                    if (response.status === 401) {
                        window.location.href = '/index.html';
                        return [];
                    }
                    return response.json();
                })
                .then(function (estaciones) {
                    const select = document.getElementById('estacionSelector');
                    select.innerHTML = '<option value="">Seleccionar estación</option>';
                    (estaciones || []).forEach(function (estacion) {
                        if (estacion.gestionado == true) {
                            const option = document.createElement('option');
                            option.value = estacion.id;
                            option.textContent = estacion.nombre + ' (' + estacion.codigo + ')';
                            select.appendChild(option);
                        }
                    });
                    if (select.options.length > 1) {
                        select.selectedIndex = 1;
                    }
                })
                .catch(function (error) {
                    console.error('Error al cargar estaciones:', error);
                    alert('Error al cargar las estaciones');
                });
        }

        function urlMovimientos(tipo) {
            const estacionId = $('#estacionSelector').val();
            const params = new URLSearchParams({
                cs_EstacionId: estacionId,
                cs_Ahora: new Date().toISOString(),
                cs_Horas: String(margenHoras())
            });
            return '/api/controlEstacion/' + tipo + '?' + params.toString();
        }

        function cargarMovimientos(forzar) {
            const estacionId = $('#estacionSelector').val();
            if (!estacionId) {
                pintarTabla('#tablaLlegadas', [], 'llegada', 'Selecciona una estación');
                pintarTabla('#tablaSalidas', [], 'salida', 'Selecciona una estación');
                return;
            }
            if (cargando && !forzar) {
                return;
            }
            cargando = true;

            Promise.all([
                fetch(urlMovimientos('llegadas'), { headers: getHeaders() }).then(leerJson),
                fetch(urlMovimientos('salidas'), { headers: getHeaders() }).then(leerJson)
            ])
                .then(function (resultados) {
                    pintarTabla('#tablaLlegadas', resultados[0], 'llegada', 'No hay llegadas');
                    pintarTabla('#tablaSalidas', resultados[1], 'salida', 'No hay salidas');
                })
                .catch(function (error) {
                    console.error('Error al cargar el control de estación:', error);
                })
                .finally(function () {
                    cargando = false;
                });
        }

        function leerJson(response) {
            if (response.status === 401) {
                window.location.href = '/index.html';
                return [];
            }
            if (!response.ok) {
                throw new Error('Respuesta no válida');
            }
            return response.json();
        }

        function pintarTabla(selector, datos, accion, vacio) {
            const tbody = document.querySelector(selector + ' tbody');
            tbody.innerHTML = '';

            if (!datos || datos.length === 0) {
                const fila = document.createElement('tr');
                fila.innerHTML = '<td colspan="6" class="text-center">' + vacio + '</td>';
                tbody.appendChild(fila);
                return;
            }

            const estados = {
                'PENDIENTE': '<span class="badge bg-warning">Pendiente</span>',
                'EN_PROGRESO': '<span class="badge bg-info">En progreso</span>',
                'COMPLETADO': '<span class="badge bg-success">Completado</span>',
                'CANCELADO': '<span class="badge bg-danger">Cancelado</span>'
            };

            datos.forEach(function (item) {
                const hora = accion === 'llegada'
                    ? (item.horaProgramadaLlegada || item.horaProgramadaSalida)
                    : (item.horaProgramadaSalida || item.horaProgramadaLlegada);
                const textoBoton = accion === 'llegada' ? 'Registrar llegada' : 'Registrar salida';
                const fila = document.createElement('tr');
                fila.innerHTML =
                    '<td>' + item.numero + '</td>' +
                    '<td>' + item.origen + '</td>' +
                    '<td>' + item.destino + '</td>' +
                    '<td>' + formatearHora(hora) + '</td>' +
                    '<td>' + (estados[item.estado] || item.estado) + '</td>' +
                    '<td><button type="button" class="btn btn-sm btn-primary registrar-movimiento" data-accion="' + accion + '" data-id="' + item.id + '">' + textoBoton + '</button></td>';
                tbody.appendChild(fila);
            });
        }

        $('#estacionSelector').on('change', cargarMovimientos);
        $('#margenHoras').on('change', function () {
            cargarMovimientos(true);
        });

        $(document).off('fechaPlanificadorCambiada.controlEstacion');

        $(document).off('click.controlEstacion', '.registrar-movimiento').on('click.controlEstacion', '.registrar-movimiento', function () {
            const boton = $(this);
            const accion = boton.data('accion');
            const circulacionId = boton.data('id');
            const estacionId = $('#estacionSelector').val();
            const verbo = accion === 'llegada' ? 'la llegada' : 'la salida';

            if (!confirm('¿Registrar ' + verbo + ' del tren ' + boton.closest('tr').children().eq(0).text() + '?')) {
                return;
            }

            boton.prop('disabled', true);
            fetch('/api/controlEstacion/' + accion, {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({
                    circulacionId: circulacionId,
                    estacionId: estacionId
                })
            })
                .then(function (response) {
                    if (response.status === 401) {
                        window.location.href = '/index.html';
                        return;
                    }
                    if (!response.ok) {
                        return response.json().then(function (error) {
                            throw new Error(error.mensaje || 'No se pudo registrar el movimiento');
                        });
                    }
                    cargarMovimientos(true);
                })
                .catch(function (error) {
                    console.error(error);
                    alert(error.message);
                    boton.prop('disabled', false);
                });
        });
    });
</script>
