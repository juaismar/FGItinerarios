<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            width: 100%;
            background: #181c24;
            color: #fff;
            font-family: 'Roboto', Arial, sans-serif;
        }
        body {
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding: 0;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #fff;
            margin: 32px 0 24px 0;
            font-size: 2.5em;
            letter-spacing: 2px;
            font-weight: 700;
        }
        .logo-top-right {
            position: fixed;
            top: 0px;
            right: 0px;
            z-index: 100;
            border-bottom-left-radius: 24px;
            background: white;
        }
        .logo-top-right img {
            height: 64px;
            width: auto;
            display: block;
        }
        .clock-top-left {
            position: fixed;
            top: 0px;
            left: 0px;
            z-index: 100;
            background: #1976d2;
            color: #fff;
            font-family: 'Roboto Mono', 'Roboto', monospace;
            font-size: 2.7em;
            font-weight: bold;
            padding: 10px 28px 10px 18px;
            border-bottom-right-radius: 24px;
            letter-spacing: 2px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.10);
        }
        .paneles {
            flex: 1;
            min-height: 0;
            display: flex;
            gap: 10px;
            padding: 0 10px 10px;
            box-sizing: border-box;
        }
        .panel {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #232a36;
            border-radius: 12px;
            overflow: hidden;
        }
        .panel h2 {
            margin: 0;
            padding: 14px 8px 10px;
            text-align: center;
            color: #ffb300;
            font-size: 2em;
            font-weight: 700;
            letter-spacing: 2px;
            background: #181c24;
        }
        .panel-cuerpo {
            flex: 1;
            min-height: 0;
            overflow: auto;
        }
        table.dataTable {
            width: 100% !important;
            min-width: 0;
            margin: 0;
            border-radius: 0;
            font-size: 1.05em;
            background: #232a36;
            color: #fff;
            box-shadow: none;
            table-layout: fixed;
        }
        .panel-cuerpo .dataTables_wrapper {
            width: 100% !important;
        }
        .panel-cuerpo thead th {
            position: sticky;
            top: 0;
            z-index: 1;
        }
        table.dataTable thead th,
        table.dataTable tbody td {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        table.dataTable thead th {
            background: #2d3a4b;
            color: #fff;
            font-weight: 700;
            font-size: 1.1em;
        }
        table.dataTable tbody td {
            background: #fff;
            color: #181c24 !important;
        }
        table.dataTable td:first-child {
            background: #43a047 !important;
            color: #fff !important;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
        }
        table.dataTable td.dataTables_empty {
            background: #232a36 !important;
            color: #9aa4b2 !important;
            font-weight: 400;
            letter-spacing: 0;
        }
        td.retraso {
            background: #c62828 !important;
            color: #fff !important;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
        }
        /* Ocultar flechas de ordenación */
        th.sorting:after, th.sorting:before,
        th.sorting_asc:after, th.sorting_asc:before,
        th.sorting_desc:after, th.sorting_desc:before {
            display: none !important;
        }
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 80px;
            background: transparent;
            position: relative;
            z-index: 200;
        }
        .station-select {
            flex: 1 1 auto;
            text-align: center;
            color: #fff;
            background: #181c24;
            font-size: 2.5em;
            font-weight: 700;
            letter-spacing: 2px;
            border: none;
            outline: none;
            text-align-last: center;
            margin: 0 24px;
            padding: 0 16px;
            border-radius: 12px;
            appearance: none;
        }
        .station-select option {
            color: #181c24;
            background: #fff;
            font-size: 1em;
        }
        .idioma-visor {
            position: absolute;
            right: 118px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 120;
            background: #1976d2;
            color: #fff;
            border: 0;
            border-radius: 8px;
            font-size: 0.95rem;
            padding: 4px 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <div class="clock-top-left" id="clock"></div>
            <select id="selectorIdioma" class="idioma-visor">
                <option value="es-ES">Español</option>
                <option value="ca-ES-valencia">Valencià</option>
                <option value="en">English</option>
            </select>
            <select id="station-select" class="station-select"></select>
            <div class="logo-top-right">
                <img src="/img/fglogotr.gif" alt="Logo FG" />
            </div>
        </div>
        <div class="paneles">
            <section class="panel">
                <h2 data-i18n="visor.salidas">Salidas</h2>
                <div class="panel-cuerpo">
                    <table id="salidas" class="display">
                        <thead>
                            <tr>
                                <th data-i18n="comun.hora">Hora</th>
                                <th data-i18n="visor.destino">Destino</th>
                                <th data-i18n="visor.tren">Tren</th>
                                <th data-i18n="visor.numero">Nº</th>
                                <th data-i18n="comun.via">Vía</th>
                                <th data-i18n="comun.observaciones">Observaciones</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
            <section class="panel">
                <h2 data-i18n="visor.llegadas">Llegadas</h2>
                <div class="panel-cuerpo">
                    <table id="llegadas" class="display">
                        <thead>
                            <tr>
                                <th data-i18n="comun.hora">Hora</th>
                                <th data-i18n="visor.procedencia">Procedencia</th>
                                <th data-i18n="visor.tren">Tren</th>
                                <th data-i18n="visor.numero">Nº</th>
                                <th data-i18n="comun.via">Vía</th>
                                <th data-i18n="comun.observaciones">Observaciones</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script>
        let tablaSalidas;
        let tablaLlegadas;

        $(document).ready(function() {
            window.idiomaListo.then(function () {
                inicializarTablas();
                cargarEstaciones();
                $('#station-select').on('change', cargarVisor);
                setInterval(cargarVisor, 15000);
            });
        });

        function fechaLocal() {
            const ahora = new Date();
            const dosDigitos = function (valor) {
                return String(valor).padStart(2, '0');
            };
            return ahora.getFullYear() + '-' + dosDigitos(ahora.getMonth() + 1) + '-' + dosDigitos(ahora.getDate());
        }

        function marcarSituacion(row, data) {
            if (data.retraso || data.cancelado) {
                $('td', row).eq(5).addClass('retraso');
            }
        }

        function cargarEstaciones() {
            return fetch('/api/estaciones')
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('No se pudieron cargar las estaciones');
                    }
                    return response.json();
                })
                .then(function (estaciones) {
                    const select = document.getElementById('station-select');
                    const codigoActual = select.value;
                    select.innerHTML = '';

                    (estaciones || []).forEach(function (estacion) {
                        const option = document.createElement('option');
                        option.value = estacion.codigo;
                        option.textContent = estacion.nombre;
                        select.appendChild(option);
                    });

                    if (codigoActual) {
                        select.value = codigoActual;
                    }
                    cargarVisor();
                })
                .catch(function (error) {
                    console.error('Error al cargar estaciones:', error);
                });
        }

        function inicializarTablas() {
            const opciones = {
                paging: false,
                searching: false,
                info: false,
                ordering: false,
                data: [],
                createdRow: marcarSituacion
            };

            tablaSalidas = $('#salidas').DataTable(Object.assign({}, opciones, {
                columns: [
                    { data: 'hora' },
                    { data: 'destino' },
                    { data: 'tren' },
                    { data: 'numero' },
                    { data: 'via' },
                    { data: null, render: function (data, type, row) { return textoSituacion(row); } }
                ],
                language: {
                    emptyTable: texto('visor.vacioSalidas', 'No hay salidas programadas')
                }
            }));

            tablaLlegadas = $('#llegadas').DataTable(Object.assign({}, opciones, {
                columns: [
                    { data: 'hora' },
                    { data: 'procedencia' },
                    { data: 'tren' },
                    { data: 'numero' },
                    { data: 'via' },
                    { data: null, render: function (data, type, row) { return textoSituacion(row); } }
                ],
                language: {
                    emptyTable: texto('visor.vacioLlegadas', 'No hay llegadas programadas')
                }
            }));
        }

        function cargarVisor() {
            const codigo = $('#station-select').val();
            if (!codigo || !tablaSalidas || !tablaLlegadas) {
                return;
            }

            const nombre = $('#station-select option:selected').text();
            document.title = nombre || 'Visor';

            fetch('/api/circulaciones/visor/' + encodeURIComponent(codigo) + '?fecha=' + fechaLocal())
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('No se pudo cargar el visor');
                    }
                    return response.json();
                })
                .then(function (datos) {
                    tablaSalidas.clear().rows.add(datos.salidas || []).draw();
                    tablaLlegadas.clear().rows.add(datos.llegadas || []).draw();
                })
                .catch(function (error) {
                    console.error('Error al cargar el visor:', error);
                });
        }

        // Pantalla completa automática
        document.addEventListener('DOMContentLoaded', () => {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
        });

        // Reloj en tiempo real
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
