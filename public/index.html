<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FGItinerarios</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/i18n.js"></script>
    <script src="/js/auth.js"></script>
</head>
<body>
    <div id="app">
        <div class="container">
            <h1>FGItinerarios</h1>
            <div class="mb-3">
                <label for="selectorIdioma" data-i18n="comun.idioma">Idioma</label>
                <select id="selectorIdioma">
                    <option value="es-ES">Español</option>
                    <option value="ca-ES-valencia">Valencià</option>
                    <option value="en">English</option>
                </select>
            </div>
            <div class="options">
                <div class="option-card">
                    <h2 data-i18n="login.titulo">Iniciar Sesión</h2>
                    <p data-i18n="login.ayuda">Accede con tu cuenta para gestionar itinerarios</p>
                    <form onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label for="email" data-i18n="comun.email">Email</label>
                            <input type="email" id="email" required>
                        </div>
                        <div class="form-group">
                            <label for="password" data-i18n="comun.password">Contraseña</label>
                            <input type="password" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary" data-i18n="login.acceder">Acceder</button>
                        <button type="button" onclick="ocultarLogin()" class="btn btn-secondary" data-i18n="comun.cancelar">Cancelar</button>
                    </form>
                </div>
                <div class="option-card">
                    <h2 data-i18n="login.visorTitulo">Acceso Visor</h2>
                    <p data-i18n="login.visorAyuda">Visualiza itinerarios sin necesidad de cuenta</p>
                    <button onclick="accederComoVisor()" class="btn btn-secondary" data-i18n="login.visorBoton">Acceder como Visor</button>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html> 
<script>

async function handleLogin(event) {
    event.preventDefault();
    if (window.idiomaListo) {
        await window.idiomaListo;
    }
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    try {
        const response = await fetch('/api/usuarios/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            // Guardar el token
            localStorage.setItem('token', data.token);
            
            verificarSesion()
        } else {
            alert(mensajeApi(data, texto('login.error', 'Error en el login')));
        }
    } catch (error) {
        console.error('Error:', error);
        alert(texto('login.conexion', 'Error al conectar con el servidor'));
    }
}


function accederComoVisor() {
    window.location.href = '/home_visor.html';
}

</script>
