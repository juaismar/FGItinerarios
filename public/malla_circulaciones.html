    <div class="container-fluid">
        <div class="header-container">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div>
                    <h2 class="mb-1"><i class="fas fa-route"></i> <span data-i18n="malla.titulo">Malla de Circulaciones</span></h2>
                    <p class="text-muted mb-0" data-i18n="malla.ayuda">Gráfico de marcha de las circulaciones del día</p>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <label for="fechaSelector" class="form-label me-2 mb-0" data-i18n="malla.fecha">Fecha:</label>
                    <input type="date" id="fechaSelector" class="form-control" style="width: auto;">
                    <button id="btnExportarPdf" class="btn btn-outline-dark" type="button" disabled>

        <div class="filtros">
            <div class="row g-3">
                <div class="col-md-3">
                    <label for="filtroEstado" class="form-label" data-i18n="malla.estado">Estado</label>
                    <select id="filtroEstado" class="form-select">
                        <option value="" data-i18n="malla.todosEstados">Todos los estados</option>
                        <option value="PENDIENTE" data-i18n="estado.PENDIENTE">Pendiente</option>
                        <option value="EN_PROGRESO" data-i18n="estado.EN_PROGRESO">En Progreso</option>
                        <option value="COMPLETADO" data-i18n="estado.COMPLETADO">Completado</option>
                        <option value="CANCELADO" data-i18n="estado.CANCELADO">Cancelado</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="filtroTipo" class="form-label" data-i18n="malla.tipo">Tipo</label>
                    <select id="filtroTipo" class="form-select">
                        <option value="" data-i18n="malla.todosTipos">Todos los tipos</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="filtroEstacion" class="form-label" data-i18n="malla.estacion">Estación</label>

    <script>
    (function () {
        const EJE_HORAS = 26;
        const ALTO_FILA = 46;
        const PX_MINUTO = 14;
        const SEPARACION_BANDA = 36;
        const HUECO_BANDA = 45;
        const SVG_NS = 'http://www.w3.org/2000/svg';

        let mallaOriginal = null;

        function textoMalla(clave, respaldo, vars) {
            if (typeof texto === 'function') {
                return texto(clave, respaldo, vars);
            }
            return respaldo || '';
        }

        function fechaLocal(fecha) {
            const dos = function (valor) {
                return String(valor).padStart(2, '0');
            };
            return fecha.getFullYear() + '-' + dos(fecha.getMonth() + 1) + '-' + dos(fecha.getDate());
        }

        function diaDelPlanificador() {
            if (window.fechaPlanificador instanceof Date && !isNaN(window.fechaPlanificador.getTime())) {
                return fechaLocal(window.fechaPlanificador);
            }
            return fechaLocal(new Date());
        }

        function minutosDia(hora) {
            if (!hora) {
                return null;
            }
            const partes = String(hora).slice(0, 5).split(':');
            const horas = Number(partes[0]);
            const minutos = Number(partes[1]);
            if (Number.isNaN(horas) || Number.isNaN(minutos)) {
                return null;
            }
            return horas * 60 + minutos;
        }

        function horaCorta(hora) {
            if (!hora) {
                return '';
            }
            return String(hora).slice(0, 5);
        }

        function escapar(valor) {
            return String(valor == null ? '' : valor)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function sinTilde(valor) {
            return String(valor || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        function svgEl(nombre, atributos) {
            const elemento = document.createElementNS(SVG_NS, nombre);
            Object.keys(atributos || {}).forEach(function (clave) {
                if (atributos[clave] != null) {
                    elemento.setAttribute(clave, atributos[clave]);
                }
            });
            return elemento;
        }

        function puntosTren(tren, indiceEstacion) {
            const puntos = [];
            tren.paradas.forEach(function (parada) {
                const indice = indiceEstacion.get(parada.estacionId);
                if (indice == null) {
                    return;
                }
                const llegada = minutosDia(parada.horaLlegada);
                const salida = minutosDia(parada.horaSalida);
                if (llegada != null) {
                    puntos.push({ minuto: llegada, indice: indice });
                }
                if (salida != null && salida !== llegada) {
                    puntos.push({ minuto: salida, indice: indice });
                }
            });
            return puntos;
        }

        function bandasDe(minutos) {
            const ordenados = Array.from(new Set(minutos)).sort(function (a, b) { return a - b; });
            if (!ordenados.length) {
                return [];
            }
            const grupos = [[ordenados[0]]];
            for (let i = 1; i < ordenados.length; i += 1) {
                if (ordenados[i] - ordenados[i - 1] > HUECO_BANDA) {
                    grupos.push([]);
                }
                grupos[grupos.length - 1].push(ordenados[i]);
            }
            return grupos.map(function (grupo) {
                const inicio = Math.floor(grupo[0] / 60) * 60;
                let fin = Math.ceil(grupo[grupo.length - 1] / 60) * 60;
                if (fin <= grupo[grupo.length - 1]) {
                    fin += 60;
                }
                if (fin <= inicio) {
                    fin = Math.min(24 * 60, inicio + 60);
                }
                if (fin > 24 * 60) {
                    fin = 24 * 60;
                }
                return { inicio: inicio, fin: fin };
            });
        }

        function trenesVisibles() {
            if (!mallaOriginal) {
                return [];
            }
            const estado = document.getElementById('filtroEstado').value;
            const tipo = document.getElementById('filtroTipo').value;
            const estacion = document.getElementById('filtroEstacion').value;
            return mallaOriginal.trenes.filter(function (tren) {
                if (estado && tren.estado !== estado) {
                    return false;
                }
                if (tipo && tren.tipo !== tipo) {
                    return false;
                }
                if (estacion && !tren.paradas.some(function (parada) {
                    return String(parada.estacionId) === estacion;
                })) {
                    return false;
                }
                return true;
            });
        }

        function rellenarSelect(select, opciones, claveTodos, respaldoTodos) {
            const elegido = select.value;
            select.innerHTML = '';
            const todos = document.createElement('option');
            todos.value = '';
            todos.textContent = textoMalla(claveTodos, respaldoTodos);
            select.appendChild(todos);
            opciones.forEach(function (opcion) {
                const elemento = document.createElement('option');
                elemento.value = opcion.valor;
                elemento.textContent = opcion.texto;
                select.appendChild(elemento);
            });
            if (Array.from(select.options).some(function (opcion) { return opcion.value === elegido; })) {
                select.value = elegido;
            }
        }

        function actualizarFiltros() {
            if (!mallaOriginal) {
                return;
            }
            const tipos = [];
            const vistos = new Set();
            mallaOriginal.trenes.forEach(function (tren) {
                if (tren.tipo && !vistos.has(tren.tipo)) {
                    vistos.add(tren.tipo);
                    tipos.push({
                        valor: tren.tipo,
                        texto: textoMalla('tipoTren.' + tren.tipo, tren.tipo)
                    });
                }
            });
            tipos.sort(function (a, b) { return a.texto.localeCompare(b.texto, 'es'); });
            rellenarSelect(document.getElementById('filtroTipo'), tipos, 'malla.todosTipos', 'Todos los tipos');

            const estaciones = mallaOriginal.estaciones.map(function (estacion) {
                return {
                    valor: String(estacion.id),
                    texto: estacion.nombre + (estacion.codigo ? ' (' + estacion.codigo + ')' : '')
                };
            });
            rellenarSelect(document.getElementById('filtroEstacion'), estaciones, 'malla.todasEstaciones', 'Todas las estaciones');
        }

        function mensaje(clase, icono, textoPlano) {
            document.getElementById('mallaVisualizacion').innerHTML =
                '<div class="' + clase + '"><i class="fas ' + icono + ' fa-2x"></i><p>' + escapar(textoPlano) + '</p></div>';
            botonPdf(false);
        }

        function botonPdf(activo) {
            const boton = document.getElementById('btnExportarPdf');
            if (boton) {
                boton.disabled = !activo;
            }
        }

        function cargarScript(url) {
            if (document.querySelector('script[src="' + url + '"]')) {
                return Promise.resolve();
            }
            return new Promise(function (resolve, reject) {
                const script = document.createElement('script');
                script.src = url;
                script.onload = function () { resolve(); };
                script.onerror = function () { reject(new Error(url)); };
                document.head.appendChild(script);
            });
        }

        let bibliotecasPdf = null;
        function asegurarPdf() {
            if (window.jspdf && window.jspdf.jsPDF && typeof window.jspdf.jsPDF.API.svg === 'function') {
                return Promise.resolve();
            }
            if (!bibliotecasPdf) {
                bibliotecasPdf = cargarScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js')
                    .then(function () {
                        return cargarScript('https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.4/dist/svg2pdf.umd.min.js');
                    })
                    .catch(function (error) {
                        bibliotecasPdf = null;
                        throw error;
                    });
            }
            return bibliotecasPdf;
        }

        function hojaParaPdf() {
            const original = document.querySelector('#mallaVisualizacion svg');
            if (!original) {
                return null;
            }
            const anchoGrafico = Number(original.getAttribute('width'));
            const altoGrafico = Number(original.getAttribute('height'));
            const margen = 118;
            const cabecera = 54;
            const ancho = margen + anchoGrafico + margen;
            const alto = cabecera + altoGrafico + 12;
            const svg = svgEl('svg', {
                xmlns: SVG_NS,
                width: ancho,
                height: alto,
                viewBox: '0 0 ' + ancho + ' ' + alto
            });
            svg.appendChild(svgEl('rect', { width: ancho, height: alto, fill: '#ffffff' }));

            const marca = svgEl('text', { x: 12, y: 28, 'font-size': 16, 'font-weight': 700, fill: '#111' });
            marca.textContent = 'FG  ' + textoMalla('malla.ferrocarril', 'Ferrocarril de La Granja');
            svg.appendChild(marca);

            const titulo = svgEl('text', {
                x: ancho / 2,
                y: 28,
                'text-anchor': 'middle',
                'font-size': 16,
                'font-weight': 700,
                fill: '#111'
            });
            titulo.textContent = (document.querySelector('.hoja-titulo') || {}).textContent
                || textoMalla('malla.grafico', 'Gráfico de circulación de trenes');
            svg.appendChild(titulo);

            const fechaNodo = document.querySelector('.hoja-fecha');
            const lineasFecha = fechaNodo ? fechaNodo.innerText.split('\n') : [];
            const fecha = svgEl('text', { x: ancho - 12, y: 22, 'text-anchor': 'end', 'font-size': 12, fill: '#111' });
            fecha.textContent = lineasFecha[0] || '';
            svg.appendChild(fecha);
            const recuento = svgEl('text', { x: ancho - 12, y: 38, 'text-anchor': 'end', 'font-size': 11, fill: '#555' });
            recuento.textContent = lineasFecha[1] || '';
            svg.appendChild(recuento);
            svg.appendChild(svgEl('line', { x1: 8, x2: ancho - 8, y1: 46, y2: 46, stroke: '#111', 'stroke-width': 1.5 }));

            const nombres = Array.from(document.querySelectorAll('.nombres-estacion:not(.derecha) .fila-estacion'));
            nombres.forEach(function (fila, indice) {
                const y = cabecera + EJE_HORAS + indice * ALTO_FILA + ALTO_FILA / 2 + 4;
                const izquierda = svgEl('text', {
                    x: margen - 10,
                    y: y,
                    'text-anchor': 'end',
                    'font-size': 11,
                    'font-weight': 700,
                    fill: '#111'
                });
                izquierda.textContent = fila.textContent.toUpperCase();
                const derecha = svgEl('text', {
                    x: margen + anchoGrafico + 10,
                    y: y,
                    'text-anchor': 'start',
                    'font-size': 11,
                    'font-weight': 700,
                    fill: '#111'
                });
                derecha.textContent = fila.textContent.toUpperCase();
                svg.appendChild(izquierda);
                svg.appendChild(derecha);
            });

            const grupo = svgEl('g', { transform: 'translate(' + margen + ' ' + cabecera + ')' });
            Array.from(original.childNodes).forEach(function (nodo) {
                grupo.appendChild(nodo.cloneNode(true));
            });
            grupo.querySelectorAll('text').forEach(function (texto) {
                if (!texto.getAttribute('stroke')) {
                    return;
                }
                texto.removeAttribute('stroke');
                texto.removeAttribute('stroke-width');
                texto.removeAttribute('paint-order');
            });
            svg.appendChild(grupo);
            return { svg: svg, ancho: ancho, alto: alto };
        }

        async function exportarPdf() {
            const hoja = hojaParaPdf();
            const boton = document.getElementById('btnExportarPdf');
            if (!hoja || !boton) {
                return;
            }
            const etiqueta = boton.querySelector('span');
            const textoBoton = etiqueta.textContent;
            boton.disabled = true;
            etiqueta.textContent = textoMalla('malla.exportando', 'Generando el PDF...');
            try {
                await asegurarPdf();
                const { jsPDF } = window.jspdf;
                const documento = new jsPDF({
                    orientation: hoja.ancho >= hoja.alto ? 'landscape' : 'portrait',
                    unit: 'px',
                    format: [hoja.ancho, hoja.alto],
                    hotfixes: ['px_scaling']
                });
                await documento.svg(hoja.svg, { x: 0, y: 0, width: hoja.ancho, height: hoja.alto });
                const dia = (mallaOriginal && mallaOriginal.fecha) || 'dia';
                documento.save('grafico-circulacion-' + dia + '.pdf');
            } catch (error) {
                console.error(error);
                alert(textoMalla('malla.errorPdf', 'No se ha podido crear el PDF'));
            } finally {
                etiqueta.textContent = textoBoton;
                boton.disabled = !document.querySelector('#mallaVisualizacion svg');
            }
        }

        function quitarTooltip() {
            document.querySelectorAll('.grafico-tooltip').forEach(function (elemento) {
                elemento.remove();
            });
        }

        function horaParada(parada) {
            const llegada = horaCorta(parada.horaLlegada);
            const salida = horaCorta(parada.horaSalida);
            if (llegada && salida && llegada !== salida) {
                return llegada + '–' + salida;
            }
            return salida || llegada;
        }

        function dibujar() {
            quitarTooltip();
            const contenedor = document.getElementById('mallaVisualizacion');
            if (!mallaOriginal || !mallaOriginal.trenes.length || !mallaOriginal.estaciones.length) {
                mensaje('no-data', 'fa-info-circle', textoMalla('malla.vacio', 'No hay circulaciones para este día'));
                return;
            }

            const trenes = trenesVisibles();
            const estaciones = mallaOriginal.estaciones;
            const indiceEstacion = new Map(estaciones.map(function (estacion, indice) {
                return [estacion.id, indice];
            }));

            const minutos = [];
            trenes.forEach(function (tren) {
                puntosTren(tren, indiceEstacion).forEach(function (punto) {
                    minutos.push(punto.minuto);
                });
            });
            const bandas = minutos.length ? bandasDe(minutos) : bandasDe([0, 60]);

            let cursor = 0;
            const tramos = bandas.map(function (banda) {
                const ancho = (banda.fin - banda.inicio) * PX_MINUTO;
                const tramo = { inicio: banda.inicio, fin: banda.fin, x0: cursor, ancho: ancho };
                cursor += ancho + SEPARACION_BANDA;
                return tramo;
            });
            const anchoTotal = Math.max(cursor - SEPARACION_BANDA, 80);
            const altoTotal = EJE_HORAS + estaciones.length * ALTO_FILA;

            function yEstacion(indice) {
                return EJE_HORAS + (estaciones.length - 1 - indice) * ALTO_FILA + ALTO_FILA / 2;
            }

            function xDe(minuto) {
                for (let i = 0; i < tramos.length; i += 1) {
                    const tramo = tramos[i];
                    if (minuto >= tramo.inicio && minuto <= tramo.fin) {
                        return tramo.x0 + (minuto - tramo.inicio) * PX_MINUTO;
                    }
                }
                let cercano = tramos[0];
                tramos.forEach(function (tramo) {
                    const distancia = Math.min(Math.abs(minuto - tramo.inicio), Math.abs(minuto - tramo.fin));
                    const mejor = Math.min(Math.abs(minuto - cercano.inicio), Math.abs(minuto - cercano.fin));
                    if (distancia < mejor) {
                        cercano = tramo;
                    }
                });
                const ajustado = Math.min(cercano.fin, Math.max(cercano.inicio, minuto));
                return cercano.x0 + (ajustado - cercano.inicio) * PX_MINUTO;
            }

            const svg = svgEl('svg', {
                width: anchoTotal,
                height: altoTotal,
                viewBox: '0 0 ' + anchoTotal + ' ' + altoTotal,
                role: 'img'
            });
            svg.setAttribute('aria-label', textoMalla('malla.grafico', 'Gráfico de circulación de trenes'));

            tramos.forEach(function (tramo, indiceTramo) {
                for (let minuto = tramo.inicio; minuto <= tramo.fin; minuto += 10) {
                    const x = xDe(minuto);
                    const esHora = minuto % 60 === 0;
                    const esMedia = minuto % 30 === 0;
                    svg.appendChild(svgEl('line', {
                        x1: x, x2: x,
                        y1: EJE_HORAS,
                        y2: altoTotal,
                        stroke: esHora ? '#222' : (esMedia ? '#8d8d8d' : '#e3e3e3'),
                        'stroke-width': esHora ? 1.15 : 0.7
                    }));
                    if (esHora) {
                        const etiqueta = svgEl('text', {
                            x: x + 4,
                            y: 16,
                            fill: '#111',
                            'font-size': 14,
                            'font-weight': 700
                        });
                        etiqueta.textContent = String(Math.floor(minuto / 60)).padStart(2, '0');
                        svg.appendChild(etiqueta);
                    } else if (minuto !== tramo.fin) {
                        const etiqueta = svgEl('text', {
                            x: x,
                            y: EJE_HORAS - 5,
                            fill: '#666',
                            'font-size': 9,
                            'text-anchor': 'middle'
                        });
                        etiqueta.textContent = String(minuto % 60);
                        svg.appendChild(etiqueta);
                    }
                }

                estaciones.forEach(function (_estacion, indice) {
                    const y = yEstacion(indice);
                    svg.appendChild(svgEl('line', {
                        x1: tramo.x0,
                        x2: tramo.x0 + tramo.ancho,
                        y1: y,
                        y2: y,
                        stroke: '#222',
                        'stroke-width': 0.8
                    }));
                });

                if (indiceTramo < tramos.length - 1) {
                    const corte = tramo.x0 + tramo.ancho + SEPARACION_BANDA / 2;
                    svg.appendChild(svgEl('path', {
                        d: 'M' + (corte - 6) + ' ' + (EJE_HORAS + 8) + ' l6 8 l-6 8 M' + (corte + 4) + ' ' + (EJE_HORAS + 8) + ' l6 8 l-6 8',
                        fill: 'none',
                        stroke: '#222',
                        'stroke-width': 1.2
                    }));
                }
            });

            trenes.forEach(function (tren) {
                const puntos = puntosTren(tren, indiceEstacion);
                if (puntos.length < 2) {
                    return;
                }
                const cancelada = tren.estado === 'CANCELADO';
                const color = cancelada ? '#b71c1c' : '#111';
                const trozos = [];
                puntos.forEach(function (punto) {
                    const tramo = tramos.find(function (candidato) {
                        return punto.minuto >= candidato.inicio && punto.minuto <= candidato.fin;
                    });
                    const ultimo = trozos[trozos.length - 1];
                    if (!ultimo || ultimo.tramo !== tramo) {
                        trozos.push({ tramo: tramo, puntos: [punto] });
                    } else {
                        ultimo.puntos.push(punto);
                    }
                });

                const grupo = svgEl('g', { cursor: 'pointer' });
                trozos.forEach(function (trozo) {
                    if (trozo.puntos.length < 2) {
                        return;
                    }
                    const d = trozo.puntos.map(function (punto, indice) {
                        const comando = indice === 0 ? 'M' : 'L';
                        return comando + xDe(punto.minuto).toFixed(1) + ' ' + yEstacion(punto.indice).toFixed(1);
                    }).join(' ');
                    const trazo = svgEl('path', {
                        d: d,
                        fill: 'none',
                        stroke: color,
                        'stroke-width': 1.7,
                        'stroke-linejoin': 'round',
                        'stroke-linecap': 'round',
                        'stroke-dasharray': cancelada ? '5 3' : null
                    });
                    const zona = svgEl('path', {
                        d: d,
                        fill: 'none',
                        stroke: 'transparent',
                        'stroke-width': 12
                    });
                    grupo.appendChild(trazo);
                    grupo.appendChild(zona);
                });

                const primero = puntos[0];
                const ultimo = puntos[puntos.length - 1];
                const x1 = xDe(primero.minuto);
                const y1 = yEstacion(primero.indice);
                const x2 = xDe(ultimo.minuto);
                const y2 = yEstacion(ultimo.indice);
                const dx = x2 - x1;
                const dy = y2 - y1;
                const largo = Math.hypot(dx, dy) || 1;
                const mx = x1 + dx * 0.28 - dy / largo * 14;
                const my = y1 + dy * 0.28 + dx / largo * 14;
                let angulo = Math.atan2(dy, dx) * 180 / Math.PI;
                if (angulo > 90 || angulo < -90) {
                    angulo += 180;
                }
                const numero = svgEl('text', {
                    x: mx.toFixed(1),
                    y: my.toFixed(1),
                    fill: color,
                    'font-size': 12,
                    'font-weight': 700,
                    'text-anchor': 'middle',
                    'dominant-baseline': 'middle',
                    transform: 'rotate(' + angulo.toFixed(1) + ' ' + mx.toFixed(1) + ' ' + my.toFixed(1) + ')',
                    stroke: '#fff',
                    'stroke-width': 3,
                    'paint-order': 'stroke',
                    'pointer-events': 'none'
                });
                numero.textContent = tren.numero;
                grupo.appendChild(numero);
                svg.appendChild(grupo);

                grupo.addEventListener('mouseenter', function (evento) {
                    quitarTooltip();
                    grupo.querySelectorAll('path').forEach(function (trazo) {
                        if (trazo.getAttribute('stroke') !== 'transparent') {
                            trazo.setAttribute('stroke', '#0d47a1');
                            trazo.setAttribute('stroke-width', '2.8');
                        }
                    });
                    const aviso = document.createElement('div');
                    aviso.className = 'grafico-tooltip';
                    const viaje = tren.paradas
                        .map(function (parada) {
                            return {
                                nombre: parada.nombre,
                                minuto: minutosDia(parada.horaSalida) != null ? minutosDia(parada.horaSalida) : minutosDia(parada.horaLlegada),
                                hora: horaParada(parada)
                            };
                        })
                        .filter(function (parada) { return parada.minuto != null; })
                        .sort(function (a, b) { return a.minuto - b.minuto; });
                    const origenReal = viaje.length ? viaje[0].nombre : tren.origen;
                    const destinoReal = viaje.length ? viaje[viaje.length - 1].nombre : tren.destino;
                    let ficha = '';
                    if (sinTilde(tren.origen) !== sinTilde(origenReal) || sinTilde(tren.destino) !== sinTilde(destinoReal)) {
                        ficha = '<div>' + escapar(textoMalla('malla.ficha', 'En la ficha figura ' + tren.origen + ' → ' + tren.destino, {
                            origen: tren.origen,
                            destino: tren.destino
                        })) + '</div>';
                    }
                    const paradas = viaje.map(function (parada) {
                        return escapar(parada.nombre) + ' ' + escapar(parada.hora);
                    }).join('<br>');
                    const estadoHtml = (typeof htmlEstado === 'function')
                        ? htmlEstado(tren.estado)
                        : escapar(tren.estado);
                    aviso.innerHTML =
                        '<strong>' + escapar(textoMalla('malla.tren', 'Tren ' + tren.numero, { numero: tren.numero })) + '</strong><br>' +
                        escapar(origenReal) + ' → ' + escapar(destinoReal) + '<br>' +
                        estadoHtml + ficha +
                        '<div style="margin-top:4px">' + paradas + '</div>';
                    document.body.appendChild(aviso);
                    aviso.style.left = Math.min(evento.clientX + 12, window.innerWidth - aviso.offsetWidth - 8) + 'px';
                    aviso.style.top = Math.min(evento.clientY + 12, window.innerHeight - aviso.offsetHeight - 8) + 'px';
                });
                grupo.addEventListener('mousemove', function (evento) {
                    const aviso = document.querySelector('.grafico-tooltip');
                    if (!aviso) {
                        return;
                    }
                    aviso.style.left = Math.min(evento.clientX + 12, window.innerWidth - aviso.offsetWidth - 8) + 'px';
                    aviso.style.top = Math.min(evento.clientY + 12, window.innerHeight - aviso.offsetHeight - 8) + 'px';
                });
                grupo.addEventListener('mouseleave', function () {
                    grupo.querySelectorAll('path').forEach(function (trazo) {
                        if (trazo.getAttribute('stroke') !== 'transparent') {
                            trazo.setAttribute('stroke', color);
                            trazo.setAttribute('stroke-width', '1.7');
                        }
                    });
                    quitarTooltip();
                });
            });

            const fechaTexto = (function () {
                const partes = String(mallaOriginal.fecha || '').split('-');
                if (partes.length !== 3) {
                    return mallaOriginal.fecha || '';
                }
                const fecha = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]), 12);
                const idioma = (typeof idiomaActual === 'function') ? idiomaActual() : 'es-ES';
                return fecha.toLocaleDateString(idioma, { day: '2-digit', month: 'long', year: 'numeric' });
            })();

            contenedor.innerHTML = '';
            const hoja = document.createElement('div');
            hoja.className = 'hoja-grafico';
            hoja.innerHTML =
                '<div class="hoja-cabecera">' +
                    '<div class="hoja-marca"><span class="marca-fg">FG</span>' + escapar(textoMalla('malla.ferrocarril', 'Ferrocarril de La Granja')) + '</div>' +
                    '<div class="hoja-titulo">' + escapar(textoMalla('malla.grafico', 'Gráfico de circulación de trenes')) + '</div>' +
                    '<div class="hoja-fecha">' + escapar(fechaTexto) + '<div class="text-muted small">' +
                        escapar(textoMalla(
                            trenes.length === 1 ? 'malla.recuentoUno' : 'malla.recuento',
                            trenes.length === 1 ? '1 circulación' : trenes.length + ' circulaciones',
                            { n: trenes.length }
                        )) +
                    '</div></div>' +
                '</div>';

            const cuerpo = document.createElement('div');
            cuerpo.className = 'grafico-cuerpo';
            const izquierda = document.createElement('div');
            izquierda.className = 'nombres-estacion';
            const derecha = document.createElement('div');
            derecha.className = 'nombres-estacion derecha';
            [izquierda, derecha].forEach(function (columna) {
                columna.style.paddingTop = EJE_HORAS + 'px';
                for (let i = estaciones.length - 1; i >= 0; i -= 1) {
                    const fila = document.createElement('div');
                    fila.className = 'fila-estacion';
                    fila.style.height = ALTO_FILA + 'px';
                    fila.textContent = estaciones[i].nombre;
                    columna.appendChild(fila);
                }
            });
            const scroll = document.createElement('div');
            scroll.className = 'grafico-scroll';
            scroll.appendChild(svg);
            cuerpo.appendChild(izquierda);
            cuerpo.appendChild(scroll);
            cuerpo.appendChild(derecha);
            hoja.appendChild(cuerpo);
            contenedor.appendChild(hoja);
            botonPdf(true);
        }

        async function cargarMalla(fecha) {
            quitarTooltip();
            mensaje('loading', 'fa-spinner fa-spin', textoMalla('malla.cargando', 'Cargando el gráfico de circulación...'));
            try {
                const cabeceras = (typeof getHeaders === 'function') ? getHeaders() : {};
                const respuesta = await fetch('/api/circulaciones/mallacirculaciones?fecha=' + encodeURIComponent(fecha), {
                    headers: cabeceras
                });
                if (respuesta.status === 401) {
                    window.location.href = '/index.html';
                    return;
                }
                if (!respuesta.ok) {
                    throw new Error('malla');
                }
                mallaOriginal = await respuesta.json();
                actualizarFiltros();
                dibujar();
            } catch (error) {
                console.error(error);
                mensaje('alert alert-danger', 'fa-exclamation-triangle', textoMalla('malla.error', 'No se ha podido cargar el gráfico'));
            }
        }

        function iniciarMalla() {
            if (window.aplicarIdioma) {
                aplicarIdioma(document.getElementById('main-content') || document);
            }
            const dia = diaDelPlanificador();
            const input = document.getElementById('fechaSelector');
            input.value = dia;
            cargarMalla(dia);

            document.getElementById('filtroEstado').addEventListener('change', dibujar);
            document.getElementById('filtroTipo').addEventListener('change', dibujar);
            document.getElementById('filtroEstacion').addEventListener('change', dibujar);
            document.getElementById('btnActualizar').addEventListener('click', function () {
                cargarMalla(input.value);
            });
            document.getElementById('btnExportarPdf').addEventListener('click', exportarPdf);
            input.addEventListener('change', function () {
                if (/^\d{4}-\d{2}-\d{2}$/.test(input.value)) {
                    const partes = input.value.split('-');
                    window.fechaPlanificador = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]), 12, 0, 0);
                    const plan = document.getElementById('fechaPlanificador');
                    if (plan) {
                        plan.value = input.value;
                    }
                }
                cargarMalla(input.value);
            });

            $(document).off('fechaPlanificadorCambiada.malla').on('fechaPlanificadorCambiada.malla', function (_evento, fecha) {
                if (!(fecha instanceof Date) || isNaN(fecha.getTime())) {
                    return;
                }
                const nuevoDia = fechaLocal(fecha);
                const selector = document.getElementById('fechaSelector');
                if (!selector) {
                    return;
                }
                selector.value = nuevoDia;
                cargarMalla(nuevoDia);
            });
        }

        iniciarMalla();
    })();
    </script>
